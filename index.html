<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Mentor Linux</title>
<meta name="description" content="Aprende y practica Linux desde el móvil: 20 módulos, terminal simulada y retos que se validan de verdad.">

<meta name="theme-color" content="#0C0A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mentor Linux">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icono-180.png">
<link rel="icon" href="assets/icons/icono-192.png">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/terminal.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ APRENDER ============ -->
  <section class="vista" data-vista="inicio" data-activa>
    <header class="cabecera">
      <div class="marca">mentor<b>@</b>linux</div>
      <div class="ficha ficha-nivel" id="ficha-nivel">Nv 1</div>
      <div class="ficha ficha-xp" id="ficha-xp">0</div>
      <div class="ficha ficha-racha" id="ficha-racha">🔥 0</div>
    </header>
    <div class="contenido" id="contenido-inicio"></div>
  </section>

  <!-- ============ MÓDULO ============ -->
  <section class="vista" data-vista="modulo">
    <div class="contenido" id="contenido-modulo"></div>
  </section>

  <!-- ============ LECCIÓN ============ -->
  <section class="vista" data-vista="leccion">
    <div class="contenido" id="contenido-leccion"></div>
  </section>

  <!-- ============ RETO ============ -->
  <section class="vista" data-vista="reto">
    <div id="reto-cabecera" style="padding:0 18px"></div>
    <div class="terminal-zona" id="reto-terminal"></div>
    <div class="zona-ayuda" id="reto-ayuda"></div>
    <div class="acciones-reto" id="reto-acciones"></div>
    <div id="reto-teclas"></div>
  </section>

  <!-- ============ EXAMEN ============ -->
  <section class="vista" data-vista="examen">
    <div class="contenido" id="contenido-examen"></div>
  </section>

  <!-- ============ TERMINAL LIBRE ============ -->
  <section class="vista" data-vista="terminal">
    <header class="cabecera">
      <div class="marca">terminal <b>libre</b></div>
      <button class="btn-fantasma" id="terminal-reiniciar" style="min-height:36px;padding:0 14px">Reiniciar</button>
    </header>
    <div class="terminal-zona" id="terminal-libre"></div>
  </section>

  <!-- ============ INCIDENTES ============ -->
  <section class="vista" data-vista="incidentes">
    <header class="cabecera"><div class="marca">modo <b>incidente</b></div></header>
    <div class="contenido" id="contenido-incidentes"></div>
  </section>

  <!-- ============ INCIDENTE EN CURSO ============ -->
  <section class="vista" data-vista="incidente">
    <div id="incidente-cabecera" style="padding:0 18px"></div>
    <div class="terminal-zona" id="incidente-terminal"></div>
    <div class="zona-ayuda" id="incidente-objetivos"></div>
    <div class="acciones-reto" id="incidente-acciones"></div>
    <div id="incidente-teclas"></div>
  </section>

  <!-- ============ CHULETAS ============ -->
  <section class="vista" data-vista="chuletas">
    <header class="cabecera"><div class="marca">chuleta<b>rio</b></div></header>
    <div class="contenido" id="contenido-chuletas"></div>
  </section>

  <!-- ============ PERFIL ============ -->
  <section class="vista" data-vista="perfil">
    <header class="cabecera"><div class="marca">tu <b>progreso</b></div></header>
    <div class="contenido" id="contenido-perfil"></div>
  </section>

  <!-- ============ PESTAÑAS ============ -->
  <nav class="pestanas" aria-label="Secciones">
    <button class="pestana" data-pestana="inicio" data-activa>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 12 3l8 7v10a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      Aprender
    </button>
    <button class="pestana" data-pestana="terminal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
      Terminal
    </button>
    <button class="pestana" data-pestana="incidentes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
      Incidentes
    </button>
    <button class="pestana" data-pestana="chuletas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h13a1 1 0 0 1 1 1v15H6a1 1 0 0 1-1-1z"/><path d="M9 4v16M12 9h4M12 13h4"/></svg>
      Chuletas
    </button>
    <button class="pestana" data-pestana="perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
      Perfil
    </button>
  </nav>
</div>

<div class="celebracion" id="celebracion" role="dialog" aria-modal="true" aria-labelledby="celebracion-titulo"></div>
<div class="brindis" id="brindis" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
