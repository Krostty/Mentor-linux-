<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Mentor Linux — aprende, practica, domina</title>
  <meta name="description" content="Aprende Linux con rutas, práctica adaptativa, 325 ejercicios, máquinas simuladas y un Wargame offline.">
  <meta name="theme-color" content="#080b19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mentor Linux">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icono-180.png">
  <link rel="icon" href="assets/icons/icono-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/data/salas.js">
  <link rel="modulepreload" href="js/data/piezas.js">
  <link rel="modulepreload" href="js/data/salas-redes.js">
  <link rel="modulepreload" href="js/data/salas-ofensiva.js">
  <link rel="modulepreload" href="js/data/modules.js">
  <link rel="modulepreload" href="js/data/modulos-1.js">
  <link rel="modulepreload" href="js/data/modulos-2.js">
  <link rel="modulepreload" href="js/data/modulos-3.js">
  <link rel="modulepreload" href="js/data/modulos-4.js">
  <link rel="modulepreload" href="js/data/checks.js">
  <link rel="modulepreload" href="js/data/habilidades.js">
  <link rel="modulepreload" href="js/data/comandos.js">
  <link rel="modulepreload" href="js/data/maquinas.js">
  <link rel="modulepreload" href="js/data/wargame.js">
  <link rel="modulepreload" href="js/data/logros.js">
  <link rel="modulepreload" href="js/data/snapshots.js">
  <link rel="modulepreload" href="js/engine/terminal.js">
  <link rel="modulepreload" href="js/engine/shell.js">
  <link rel="modulepreload" href="js/engine/fs.js">
  <link rel="modulepreload" href="js/engine/commands/index.js">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="marca" data-ir="aprender" aria-label="Ir a Aprender">
        <span class="marca-prompt">_</span>mentor<span>@linux</span>
      </button>
      <div class="estado-global" aria-label="Tu progreso">
        <span class="stat-chip" id="ficha-nivel">Nv 1</span>
        <span class="stat-chip stat-xp" id="ficha-xp">0 XP</span>
        <span class="stat-chip" id="ficha-racha">🔥 0</span>
      </div>
    </header>

    <main class="vista" id="vista" tabindex="-1"></main>

    <nav class="pestanas" aria-label="Secciones principales">
      <button class="pestana" data-pestana="aprender" data-activa>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>
        <span>Aprender</span>
      </button>
      <button class="pestana" data-pestana="maquinas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3M7 9l2 2-2 2M12 13h4"/></svg>
        <span>Máquinas</span>
      </button>
      <button class="pestana" data-pestana="practicar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M7 17l-2 4 4-2M14 8l2 2-6 6-3 1 1-3z"/></svg>
        <span>Practicar</span>
      </button>
      <button class="pestana" data-pestana="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <div class="celebracion" id="celebracion" role="dialog" aria-modal="true" aria-labelledby="celebracion-titulo"></div>
  <div class="brindis" id="brindis" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
